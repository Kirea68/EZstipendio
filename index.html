<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1022">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stipendio">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il mio stipendio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#0e1022;--card:#181a36;--text:#eeedff;--muted:#9b9dc9;--line:#2a2d58;--hero:linear-gradient(135deg,#4a35d6,#8b3ff0 55%,#d946b8);--hero-t:#fff;--accent:#6e5df0;--ok:#4fe3b5;--bad:#ff7d8f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:18px 16px 100px}
h1{font-size:1.15rem;margin:0;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.muted{color:var(--muted);font-size:.88rem}
.hero{background:var(--hero);color:var(--hero-t);border-radius:26px 26px 10px 26px;padding:22px 22px 18px}
.hero .big{font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .big.neg{color:#ff9d8c}
.hero small{opacity:.8;font-size:.88rem}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);margin:14px 0 10px;overflow:hidden}
:root[data-theme="dark"] .bar{background:rgba(0,0,0,.15)}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.row2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0;opacity:.9}
nav{display:flex;gap:6px;margin:0 0 12px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sec{background:var(--card);border-radius:16px;padding:6px 14px 8px;margin:12px 0}
.sec h2{font-size:1rem;margin:10px 0 2px;display:flex;justify-content:space-between;font-weight:600}
.pay{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.pay input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.pay .n{flex:1;min-width:0}
.pay .n b{display:block;font-weight:600;overflow-wrap:anywhere}
.pay.done .n b{text-decoration:line-through;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.late{color:var(--bad);font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
dialog{border:0;border-radius:20px;padding:22px;max-width:420px;width:calc(100% - 28px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(10,14,28,.6)}
dialog h3{margin:0 0 6px;font-size:1.2rem}
label{display:block;margin:12px 0 4px;font-size:.88rem;color:var(--muted)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sv{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--card);border-radius:999px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:2px}
.add{display:flex;gap:8px;margin:12px 0}
nav button{font-size:.88rem;padding:10px 4px}
.grid{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:18px;align-items:start}
.grid>div{min-width:0}
aside{background:var(--card);border-radius:16px;padding:8px;position:sticky;top:12px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:9px 10px 8px;border-radius:10px;cursor:pointer}
aside button[aria-current="true"]{background:var(--bg);font-weight:600}
aside .t{display:flex;justify-content:space-between;gap:8px}
aside .m{display:block;height:4px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
aside .m i{display:block;height:100%;background:var(--accent)}
@media(max-width:820px){.grid{grid-template-columns:1fr}aside{position:static;display:flex;gap:6px;overflow-x:auto;padding:6px}aside button{flex:none;width:auto;min-width:120px;white-space:nowrap}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:.8rem;color:var(--muted)}
.cal .d{min-height:62px;background:var(--card);border-radius:10px;padding:5px 5px 4px;font-size:.82rem;overflow:hidden}
.cal .d.today{outline:2px solid var(--text)}
.cal .d.o{background:transparent}
.cal .p{display:block;margin-top:3px;border-radius:6px;padding:1px 4px;font-size:.72rem;font-weight:600;background:var(--accent);color:#fff;white-space:nowrap}
.cal .p.ok{background:var(--ok);color:var(--bg)}
.cal .p.bad{background:var(--bad);color:var(--bg)}
.cal button.d{border:0;text-align:left;font-family:inherit;color:var(--text);cursor:pointer;width:100%}
.calnav{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.calnav select{width:auto;flex:1;min-width:0}
.calnav .btn{padding:9px 12px}
.btn:disabled{opacity:.4;cursor:default}
nav{overflow-x:auto}
nav button{flex:none;padding:10px 14px}
.alert{margin-top:12px;padding:8px 12px;background:var(--card);border-left:4px solid var(--accent);border-radius:10px;font-size:.92rem}
.alert:empty{display:none}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-size:2rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:4}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
.hp .pay.done{display:none}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Il mio stipendio</h1><span class="muted"><span id="sync"></span> <span id="cyc"></span></span></div>
  <section class="hero" aria-live="polite">
    <small>Ti restano</small>
    <div class="big" id="left"></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="row2"><span id="l1"></span><span id="l2"></span></div>
    <div class="row2" style="margin-top:8px" id="l4"></div>
    <div class="row2" style="margin-top:8px"><span id="l3"></span><button class="linkbtn" id="edSal">Modifica stipendio</button></div>
  </section>
  <div id="alert" class="alert" aria-live="polite"></div>
  <div class="grid"><aside id="side" aria-label="Sezioni"></aside><div>
  <nav role="tablist">
    <button role="tab" data-t="pay">Pagamenti</button>
    <button role="tab" data-t="cal">Calendario</button>
    <button role="tab" data-t="rate">Rate</button>
    <button role="tab" data-t="cred">Crediti</button>
    <button role="tab" data-t="sav">Risparmi</button>
    <button role="tab" data-t="sec">Sezioni</button>
  </nav>
  <div id="view"></div>
  </div></div>
</main>
<button class="fab" id="fab" onclick="fabGo()" aria-label="Aggiungi">+</button>
<div id="toast" role="status"></div>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script>
const KEY="stipendio-v1",EUR=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
const DEF=["Affitto","Bollette","Prestiti","Pagamenti a rate","Cibo"];
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{salary:null,sections:DEF.slice(),payments:[],savings:[]};
const save=()=>{S.at=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}schedPush()};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{v=String(v).trim();if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");return parseFloat(v)};
const fmtD=d=>d.getDate()+" "+MESI[d.getMonth()];
function keyOf(d){const s=d.getDate()>=15?new Date(d.getFullYear(),d.getMonth(),15):new Date(d.getFullYear(),d.getMonth()-1,15);return s.getFullYear()+"-"+String(s.getMonth()+1).padStart(2,"0")}
const keyDate=k=>{const [y,m]=k.split("-").map(Number);return new Date(y,m-1,15)};
const nextStart=k=>{const d=keyDate(k);return new Date(d.getFullYear(),d.getMonth()+1,15)};
const CUR=keyOf(new Date());
const mdiff=(a,b)=>{const[x,y]=a.split("-").map(Number),[u,v]=b.split("-").map(Number);return (u-x)*12+(v-y)};
const shiftKey=(k,n)=>{const[y,m]=k.split("-").map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const vis=(p,k)=>p.kind==="monthly"||(p.kind==="rate"?(d=>d>=0&&d<p.total)(mdiff(p.cycle,k)):p.cycle===k);
const amtAt=(p,n)=>p.amounts&&p.amounts[n]!=null?p.amounts[n]:p.amount;
const list=k=>S.payments.filter(p=>vis(p,k)).map(p=>p.kind==="rate"?{...p,amount:amtAt(p,mdiff(p.cycle,k))}:p);
const isPaid=(p,k)=>!!(p.paid&&p.paid[k]);
const paidSum=k=>list(k).filter(p=>isPaid(p,k)).reduce((a,p)=>a+p.amount,0);
function dueDate(p,k){if(p.kind==="once"&&p.date)return toD(p.date);const s=keyDate(k);return p.day>=15?new Date(s.getFullYear(),s.getMonth(),p.day):new Date(s.getFullYear(),s.getMonth()+1,p.day)}
let tab="pay",filt=null,dayISO="";
const ISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toD=s=>new Date(s+'T00:00');
S.payments.forEach(p=>{if(!p.date){const d=p.day?dueDate(p,p.cycle):keyDate(p.cycle);p.date=ISO(d);p.day=d.getDate()}});
const pdTxt=(p,k)=>{const v=p.paid&&p.paid[k];return typeof v==='string'?', pagato il '+fmtD(toD(v)):''};
S.credits=S.credits||[];
const credIn=k=>S.credits.filter(c=>c.received&&keyOf(toD(c.received))===k).reduce((a,c)=>a+c.amount,0);
const MESI_L=Array.from({length:12},(_,i)=>new Date(2000,i,1).toLocaleDateString('it-IT',{month:'long'}));
const Y0=new Date().getFullYear()-2,Y1=new Date().getFullYear()+3;
let cm=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function occOn(d){
  const r=[];
  for(const p of S.payments){
    const s=toD(p.date);
    if(d<s)continue;
    let ok,n=0;
    if(p.kind==='once')ok=ISO(d)===p.date;
    else{
      n=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      ok=d.getDate()===Math.min(s.getDate(),dim)&&(p.kind==='monthly'||n<p.total);
    }
    if(ok)r.push({p:p.kind==='rate'?{...p,amount:amtAt(p,n)}:p,k:p.kind==='once'?p.cycle:keyOf(d)});
  }
  return r;
}
$('view').onchange=e=>{const t=e.target.dataset;if(t.tg){const[i,k]=t.tg.split('|');toggle(+i,k,'')}else if(t.cr)credGot(+t.cr);else if(t.lim!==undefined){const s=decodeURIComponent(t.lim),v=num(e.target.value);S.limits=S.limits||{};if(v>0)S.limits[s]=v;else delete S.limits[s];save();render()}else if(t.pct){const v=parseInt(e.target.value);if(v>=0&&v<=100){S.pct=v;save()}render()}else if(t.goal!==undefined){const v=num(e.target.value);if(v>0)S.goal=v;else delete S.goal;save();render()}else if(t.ra){const[i,n]=t.ra.split('|'),p=S.payments.find(x=>x.id===+i),v=num(e.target.value);p.amounts=p.amounts||{};if(v>=0&&v!==p.amount)p.amounts[n]=v;else delete p.amounts[n];save();render()}};
$('view').onclick=e=>{const b=e.target.closest('[data-d]');if(b)dayDlg(b.dataset.d)};
$('dlg').onchange=e=>{const t=e.target.dataset;if(t.tg){const[i,k]=t.tg.split('|');toggle(+i,k,dayISO)}else if(t.pv){const[i,k]=t.pv.split('|');setPaid(+i,k,e.target.value)}};
$('dlg').onclick=e=>{const a=e.target.dataset.add;if(a)payDlg(a)};
$('dlg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&['text','number'].includes(e.target.type)){const b=$('dbody').querySelector('.btn:not(.alt)');if(b){e.preventDefault();b.click()}}});
const enc=s=>encodeURIComponent(s).replace(/'/g,"%27");

function render(){
  const cr=credIn(CUR),sal=(S.salary&&S.salary.cycle===CUR?S.salary.amount:0)+cr;
  const paid=paidSum(CUR),left=sal-paid;
  const todo=list(CUR).filter(p=>!isPaid(p,CUR)).reduce((a,p)=>a+p.amount,0);
  const end=new Date(nextStart(CUR).getTime()-864e5);
  const days=Math.max(0,Math.ceil((nextStart(CUR)-new Date())/864e5));
  $("cyc").textContent="dal "+fmtD(keyDate(CUR))+" al "+fmtD(end);
  const el=$("left");el.textContent=EUR.format(left);el.classList.toggle("neg",left<0);
  $("fill").style.width=(sal>0?Math.min(100,paid/sal*100):0)+"%";
  $("l1").textContent="Stipendio "+EUR.format(sal-cr)+(cr?" + crediti "+EUR.format(cr):"");
  $("l2").textContent="Pagato "+EUR.format(paid);
  const free=left-todo;$("l4").textContent=free>=0?"Dopo tutti i pagamenti ti avanzano "+EUR.format(free)+", circa "+EUR.format(free/Math.max(days,1))+" al giorno":"Mancano "+EUR.format(-free)+" per coprire i pagamenti previsti";
  $("l3").textContent="Ancora da pagare "+EUR.format(todo)+", nuovo stipendio tra "+days+(days===1?" giorno":" giorni");
  alertBar();document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
  $("side").innerHTML=sideView();$("view").className=hidePaid&&tab==="pay"?"hp":"";$("fab").style.display=tab==="sec"||tab==="sav"?"none":"flex";
  $("view").innerHTML=tab==="pay"?payView():tab==="cal"?calView():tab==="rate"?rateView():tab==="cred"?credView():tab==="sav"?savView():secView();
}

function payView(){
  const groups=filt?[filt]:S.sections.slice();
  const orphan=list(CUR).filter(p=>!S.sections.includes(p.section));
  if(orphan.length&&!filt)groups.push("Senza sezione");
  let h='<button class="btn" onclick="payDlg()">Nuovo pagamento</button> <button class="btn alt" onclick="quickDlg()">Spesa veloce</button> <button class="btn alt" onclick="togHP()">'+(hidePaid?'Mostra tutti':'Nascondi pagati')+'</button>';
  let any=false;
  for(const g of groups){
    const items=list(CUR).filter(p=>g==="Senza sezione"?!S.sections.includes(p.section):p.section===g)
      .sort((a,b)=>(a.day||99)-(b.day||99));
    if(!items.length)continue;any=true;
    const tot=items.reduce((a,p)=>a+p.amount,0);
    h+='<div class="sec"><h2><span>'+ico(g)+' '+esc(g)+'</span><span class="amt'+limCls(g,tot)+'">'+EUR.format(tot)+limTxt(g)+'</span></h2>';
    for(const p of items){
      const d=isPaid(p,CUR),late=!d&&p.day&&new Date()>new Date(dueDate(p,CUR).getTime()+864e5);
      const sub=(p.kind==="monthly"?"Ogni mese":p.kind==="rate"?"Rata "+(mdiff(p.cycle,CUR)+1)+" di "+p.total:"Solo questo ciclo")+(", scade il "+fmtD(dueDate(p,CUR))+pdTxt(p,CUR));
      h+='<div class="pay'+(d?" done":"")+'"><input type="checkbox" aria-label="Segna come pagato" '+(d?"checked":"")+' onchange="toggle('+p.id+')"><div class="n"><b>'+esc(p.name)+'</b><span class="muted'+(late?" late":"")+'">'+sub+(late?", in ritardo":"")+'</span></div><span class="amt">'+EUR.format(p.amount)+'</span><button class="x" aria-label="Modifica" onclick="editDlg('+p.id+')">✎</button><button class="x" aria-label="Elimina" onclick="delPay('+p.id+')">×</button></div>';
    }
    h+="</div>";
  }
  if(!any)h+='<p class="empty">Nessun pagamento per questo ciclo. Aggiungi affitto, bollette, rate o una spesa per il cibo.</p>';
  return h;
}
function savView(){
  const tot=S.savings.reduce((a,s)=>a+s.a,0);
  let h='<div class="sec" style="padding:16px 14px"><span class="muted">Messi da parte finora</span><div class="sv">'+EUR.format(tot)+'</div>'+(S.goal?'<div class="bar" style="margin:10px 0 4px"><i style="width:'+Math.min(100,tot/S.goal*100)+'%"></i></div><span class="muted">Obiettivo '+EUR.format(S.goal)+': raggiunto al '+Math.round(tot/S.goal*100)+'%</span>':'')+'<label for="pc" style="margin-top:14px">Percentuale dell’avanzo da mettere da parte a fine ciclo</label><input id="pc" inputmode="numeric" style="width:90px" value="'+PCT()+'" data-pct="1"><label for="gl">Obiettivo di risparmio in euro (facoltativo)</label><input id="gl" inputmode="decimal" style="width:140px" value="'+(S.goal?S.goal.toFixed(2).replace('.',','):'')+'" data-goal="1"></div>';
  if(!S.savings.length)return h+'<p class="empty">Alla chiusura del ciclo ti chiederò se vuoi mettere da parte il 75% di quello che avanza.</p>';
  h+='<div class="sec">';
  for(const s of S.savings.slice().reverse())h+='<div class="pay"><div class="n"><b>'+esc(s.note)+'</b><span class="muted">'+fmtD(new Date(s.d))+" "+new Date(s.d).getFullYear()+'</span></div><span class="amt">'+EUR.format(s.a)+'</span></div>';
  return h+"</div>";
}
function secView(){
  let h='<div class="add"><input id="newSec" placeholder="Nuova sezione, per esempio Abbonamenti" aria-label="Nome nuova sezione"><button class="btn" onclick="addSec()">Aggiungi</button></div><div class="chips">';
  for(const s of S.sections)h+='<span class="chip">'+esc(s)+'<button class="x" aria-label="Rimuovi '+esc(s)+'" onclick="delSec(\''+enc(s)+'\')">×</button></span>';
  h+='</div><p class="muted">Se togli una sezione, i suoi pagamenti restano visibili sotto “Senza sezione”.</p>';
  h+=limBlock();h+='<div style="margin-top:22px"><button class="btn alt" onclick="closeFlow()">Chiudi il ciclo adesso</button> <button class="btn alt" onclick="bkDlg()">Backup e ripristino</button><p class="muted">Utile per provare il passaggio al nuovo stipendio senza aspettare il 15.</p></div>';
  return h;
}

function sideView(){
  const all=list(CUR),sum=all.reduce((a,p)=>a+p.amount,0),tot=sum||1;
  const row=(name,val,key)=>'<button aria-current="'+(filt===key)+'" onclick="setFilt('+(key===null?"null":"'"+enc(key)+"'")+')"><span class="t"><span>'+(key===null?'':ico(name)+' ')+esc(name)+'</span><span class="amt">'+EUR.format(val)+'</span></span><span class="m"><i style="width:'+(val/tot*100)+'%"></i></span></button>';
  return row("Tutte",sum,null)+S.sections.map(s=>row(s,all.filter(p=>p.section===s).reduce((a,p)=>a+p.amount,0),s)).join("");
}
function setFilt(e){filt=e===null?null:decodeURIComponent(e);tab="pay";render()}
function calViewOld(){
  const s=keyDate(CUR),n=Math.round((nextStart(CUR)-s)/864e5),off=(s.getDay()+6)%7,today=new Date().toDateString(),t0=new Date().setHours(0,0,0,0);
  const items=list(CUR).filter(p=>p.day&&(!filt||p.section===filt)).map(p=>({p,d:dueDate(p,CUR)}));
  let h='<div class="cal">'+"LMMGVSD".split("").map(c=>'<span class="h">'+c+"</span>").join("");
  for(let i=0;i<off;i++)h+='<span class="d o"></span>';
  for(let i=0;i<n;i++){
    const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i),its=items.filter(x=>x.d.toDateString()===d.toDateString());
    let pill="";

const setSync=t=>{const e=$('sync');if(e)e.textContent=t};
const needCycle=()=>{if((!S.salary||S.salary.cycle!==CUR)&&!dlg.open)closeFlow()};
function schedPush(){if(!ref)return;setSync('Salvataggio…');clearTimeout(pt);pt=setTimeout(push,700)}
async function push(){
  if(busy){dirty=true;return}
  busy=true;
  try{await ref.set({json:JSON.stringify(S),at:S.at});setSync('Sincronizzato online')}catch(e){dirty=false;setSync('Non sincronizzato, riprovo al prossimo salvataggio')}
  busy=false;
  if(dirty){dirty=false;push()}
}
function adopt(d){
  try{const o=JSON.parse(d.json);o.credits=o.credits||[];S=o;S.at=d.at;try{localStorage.setItem(KEY,d.json)}catch(e){}setSync('Sincronizzato online');render()}catch(e){}
}
async function initSync(){
  let done=false;
  const fin=()=>{if(!done){done=true;needCycle()}};
  setTimeout(fin,10000);
  try{
    const db=await claude.use('db'),user=await claude.use('user');
    const uid=db&&user?await user.id():null;
    if(!uid){setSync('Solo su questo dispositivo');fin();return}
    ref=db.collection('data/users/'+uid).doc('state');
    setSync('Sincronizzazione…');
    ref.onSnapshot(snap=>{
      const d=snap.exists?snap.data():null;
      if(d&&d.at>(S.at||0))adopt(d);
      else if(!snap.metadata.fromCache){
        if(!d){if(S.payments.length||S.salary||S.credits.length){S.at=S.at||Date.now();push()}else setSync('Sincronizzato online')}
        else if(d.at<(S.at||0))push();
        else setSync('Sincronizzato online');
      }
      if(!snap.metadata.fromCache)fin();
    },()=>{setSync('Solo su questo dispositivo');ref=null;fin()});
  }catch(e){setSync('Solo su questo dispositivo');fin()}
}
initSync();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
